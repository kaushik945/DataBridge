# Isolated verification stack: distinct ports, network and disposable database volume.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: databridge
      POSTGRES_USER: databridge
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: [CMD-SHELL, pg_isready -U databridge]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [smokedata:/var/lib/postgresql/data]
  api:
    image: databridge-manual-smoke
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://databridge:local-development-only@db:5432/databridge
      AI_MODE: mock
      ALLOWED_ORIGINS: http://localhost:5273
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:8100:8000"]
  web:
    image: databridge-web
    build: ./frontend
    depends_on: [api]
    ports: ["127.0.0.1:5273:80"]
volumes:
  smokedata:
