# Explicit local Vertex opt-in; never copies credentials into the image.
# Run with: docker compose -f compose.yaml -f compose.vertex.yaml ...
services:
  api:
    build:
      args:
        INSTALL_VERTEX: 'true'
    environment:
      AI_MODE: vertex
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-adc.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Select a project before enabling Vertex}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:?Select a supported location}
      VERTEX_MODEL: ${VERTEX_MODEL:?Select a supported generation model}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?Select a supported embedding model}
      GCS_BUCKET: ''
    volumes:
      - type: bind
        source: ${APPDATA:?APPDATA is required}/gcloud/application_default_credentials.json
        target: /run/secrets/google-adc.json
        read_only: true
        bind:
          create_host_path: false
